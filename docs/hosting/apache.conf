# RDM Toolkit — security headers for Apache 2.4+
#
# Drop into the site's <VirtualHost>, or rename to .htaccess in the document
# root if AllowOverride FileInfo is enabled. Every directive here works under
# FileInfo — no directive in this file requires AllowOverride All.
#
# Requires: a2enmod headers setenvif
#
# These are not optional hardening. index.html carries a fallback <meta> CSP,
# but a meta tag cannot deliver:
#   - frame-ancestors 'none' — ignored in meta per the CSP spec, so without
#     this header the site can be framed (clickjacking).
#   - Strict-Transport-Security, X-Content-Type-Options, X-Frame-Options,
#     Permissions-Policy, Referrer-Policy — HTTP headers that browsers do not
#     honour from meta tags at all.
# Serve these and the site keeps the posture it was built with.

<IfModule mod_headers.c>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; trusted-types dompurify default; require-trusted-types-for 'script'; upgrade-insecure-requests"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()"
    Header always set X-Frame-Options "DENY"
</IfModule>

# The service worker must never be served stale, or users get pinned to an old
# build. Hashed assets under /assets/ are immutable and safe to cache forever.
#
# The /assets/ rule is scoped with SetEnvIf rather than <If>. <If> has Override
# context "All", so in a .htaccess under AllowOverride FileInfo it fails with
# "<If not allowed here" and typically 500s every request. SetEnvIf is
# FileInfo-safe, so this file stays deployable exactly as described above.
<IfModule mod_setenvif.c>
    SetEnvIf Request_URI "^/assets/" is_hashed_asset
</IfModule>
<IfModule mod_headers.c>
    <FilesMatch "^(sw\.js|registerSW\.js)$">
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
    <FilesMatch "\.(js|mjs|css|woff2)$">
        Header always set Cache-Control "public, max-age=31536000, immutable" env=is_hashed_asset
    </FilesMatch>
</IfModule>

# .mjs and .webmanifest are commonly missing from default MIME maps. A .mjs
# served as the wrong type breaks the pdfjs worker and every lazy-loaded tool.
# text/javascript is the registered type per RFC 9239.
<IfModule mod_mime.c>
    AddType text/javascript .mjs
    AddType application/manifest+json .webmanifest
</IfModule>
