# RDM Toolkit — security headers for nginx
#
# Include inside the site's server { } block.
#
# These are not optional hardening. index.html carries a fallback <meta> CSP,
# but a meta tag cannot deliver:
#   - frame-ancestors 'none' — ignored in meta per the CSP spec, so without
#     this header the site can be framed (clickjacking).
#   - Strict-Transport-Security, X-Content-Type-Options, X-Frame-Options,
#     Permissions-Policy, Referrer-Policy — HTTP headers that browsers do not
#     honour from meta tags at all.
# Serve these and the site keeps the posture it was built with.
#
# IMPORTANT — nginx add_header inheritance:
# add_header directives are inherited from an enclosing http/server/location
# block ONLY IF the current block does not declare any add_header of its own.
# The moment a location block adds even one add_header (e.g. the Cache-Control
# rules below), it stops inheriting ALL of the add_header directives set at
# the server level — including these six security headers. To avoid silently
# dropping CSP/HSTS/Trusted-Types on /sw.js and /assets/, every location block
# below repeats the full set of six headers rather than relying on inheritance.
# If you add another location block with its own add_header, do the same.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; trusted-types dompurify default; require-trusted-types-for 'script'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
add_header X-Frame-Options "DENY" always;

# MIME TYPES — do NOT add a types { } block here.
#
# .mjs is missing from nginx's default mime.types on most builds, and served as
# the wrong type it breaks the pdfjs worker and every lazy-loaded tool. But a
# types { } block does not EXTEND the inherited map, it REPLACES it — declaring
# one here would drop every mapping that http-level `include mime.types;`
# provides, so .css, .svg, .json, images and fonts would all fall back to
# default_type (usually application/octet-stream) and browsers would refuse to
# apply the stylesheet. That breaks the whole site, quietly.
#
# Instead add these two lines to the canonical /etc/nginx/mime.types, inside
# the types { } block that file already defines:
#
#     text/javascript                       mjs;
#     application/manifest+json             webmanifest;
#
# (text/javascript is the registered type for .mjs per RFC 9239.) Every context
# already includes that file, so the mappings apply site-wide with nothing
# replaced.

# Never serve a stale service worker — it pins users to an old build.
# Repeats the six security headers (see inheritance note above) because this
# block declares its own add_header for Cache-Control.
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; trusted-types dompurify default; require-trusted-types-for 'script'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header X-Frame-Options "DENY" always;
}

# registerSW.js is the loader that boots the service worker. Cached stale it
# pins users to old registration logic, the same class of bug this project
# already shipped and fixed once. Must never be cached either.
# Repeats the six security headers (see inheritance note above) because this
# block declares its own add_header for Cache-Control.
location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; trusted-types dompurify default; require-trusted-types-for 'script'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header X-Frame-Options "DENY" always;
}

# Hashed asset filenames are immutable.
# Repeats the six security headers (see inheritance note above) because this
# block declares its own add_header for Cache-Control.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; trusted-types dompurify default; require-trusted-types-for 'script'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header X-Frame-Options "DENY" always;
}
