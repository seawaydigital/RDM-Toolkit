name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Security audit
        run: |
          npm run security:audit
          npm audit signatures
          npm audit --omit=dev --audit-level=high

      - run: npm run build

      - name: Record bundle integrity
        run: node scripts/bundle-integrity.mjs > dist/bundle-integrity.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**/*.js
            dist/**/*.mjs
            dist/**/*.css
            dist/index.html
            dist/bundle-integrity.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # v5 drops every dot-prefixed path by default, which silently kept
          # /.well-known/security.txt (RFC 9116) off the live site even after
          # #113 added .nojekyll. dist/ contains no other dotfiles.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

      # Post-deploy smoke check: the page and the security contact must both be
      # reachable. Retries cover the CDN catching up with the new artifact.
      - name: Smoke-check the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$base/" | grep -q 'id="root"' &&
               curl -fsS "$base/.well-known/security.txt" | grep -q '^Contact:'; then
              echo "Live site and security.txt OK"; exit 0
            fi
            sleep 20
          done
          echo "::error::Live site or /.well-known/security.txt not reachable after deploy"
          exit 1

